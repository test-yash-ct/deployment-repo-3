apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      containers:
        - name: patient-service
          image: registry.example.com/healthops/patient-service:1.0.0
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: patient-db
                  key: url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: patient-secrets
                  key: jwt
            - name: DEBUG
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: patient-service
spec:
  selector:
    app: patient-service
  ports:
    - port: 8080
      targetPort: 8080
