apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: reporting-service
  template:
    metadata:
      labels:
        app: reporting-service
    spec:
      hostNetwork: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reporting-service
          image: registry.example.com/healthops/reporting-service:1.0.0
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8082
          volumeMounts:
            - name: reports
              mountPath: /data/reports
          env:
            - name: REPORT_ROOT
              value: /data/reports
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: reporting-secrets
                  key: jwt
            - name: REPORT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: reporting-secrets
                  key: report-key
            - name: LISTEN_ADDR
              value: "0.0.0.0:8082"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: reporting-reports
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reporting-reports
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
spec:
  selector:
    app: reporting-service
  ports:
    - port: 8082
      targetPort: 8082
