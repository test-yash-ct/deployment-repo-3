apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduling-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scheduling-service
  template:
    metadata:
      labels:
        app: scheduling-service
        healthops.io/request-id-header: X-Request-ID
      annotations:
        healthops.io/correlation-header: X-Request-ID
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: scheduling-service
          image: registry.example.com/healthops/scheduling-service:1.0.0
          ports:
            - containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scheduling-db
                  key: url
            - name: SERVICE_VERSION
              value: "1.0.0"
            - name: GIT_SHA
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['healthops.io/git-sha']
            - name: BUILD_TIME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['healthops.io/build-time']
---
apiVersion: v1
kind: Service
metadata:
  name: scheduling-service
  labels:
    healthops.io/events: outbox
spec:
  selector:
    app: scheduling-service
  ports:
    - port: 8081
      targetPort: 8081
