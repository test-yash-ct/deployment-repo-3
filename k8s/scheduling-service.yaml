apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduling-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scheduling-service
  template:
    metadata:
      labels:
        app: scheduling-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduling-service
          image: registry.example.com/healthops/scheduling-service:1.0.0
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8081
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scheduling-db
                  key: url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: scheduling-secrets
                  key: jwt
            - name: WEBHOOK_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: scheduling-config
                  key: webhook-allowlist
            - name: LISTEN_ADDR
              value: "0.0.0.0:8081"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: scheduling-service
spec:
  selector:
    app: scheduling-service
  ports:
    - port: 8081
      targetPort: 8081
